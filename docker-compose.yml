services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Mexico_City}
      TZ: ${TZ:-America/Mexico_City}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-500}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      AUTOMATION_MODE: ${AUTOMATION_MODE:-dry-run}
      CLASSROOM_PWA_COURSE_ID: ${CLASSROOM_PWA_COURSE_ID}
      CLASSROOM_DMI_COURSE_ID: ${CLASSROOM_DMI_COURSE_ID}
      PWA_REPOSITORY: ${PWA_REPOSITORY:-Draggodeidad/pwa-utt}
      DMI_REPOSITORY: ${DMI_REPOSITORY:-Draggodeidad/campusops-dmi-team}
      MAX_ZIP_SIZE_MB: ${MAX_ZIP_SIZE_MB:-25}
      MAX_EXTRACTED_SIZE_MB: ${MAX_EXTRACTED_SIZE_MB:-100}
      MAX_ZIP_FILES: ${MAX_ZIP_FILES:-500}
      MAX_SINGLE_FILE_MB: ${MAX_SINGLE_FILE_MB:-10}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-qwen/qwen3.8-27b:free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-z-ai/glm-5.2:free}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    volumes:
      - n8n_data:/home/node/.n8n
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  n8n_data:
    name: classroom_automation_n8n_data
